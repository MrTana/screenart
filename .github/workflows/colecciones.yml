name: Colecciones precargadas
on:
  schedule:
    - cron: '17 3 * * 1'   # lunes 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/wd-shards.py', '.github/workflows/colecciones.yml']
permissions:
  contents: write
concurrency: colecciones
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Descargar obras de Wikidata (Louvre, Orsay, Prado)
        run: python3 tools/wd-shards.py
      - name: Guardar si cambió algo
        run: |
          git config user.name "colecciones-bot"
          git config user.email "colecciones-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Colecciones precargadas: actualización semanal"
          git pull --rebase origin main && git push origin HEAD:main
