name: Prueba diaria de fuentes
on:
  schedule:
    - cron: '41 5 * * *'   # cada día 05:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/probe.mjs', 'src/core.js', '.github/workflows/sondeo.yml']
permissions:
  contents: write
concurrency: sondeo
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar cada fuente contra el servicio real
        id: probe
        continue-on-error: true
        run: node tools/probe.mjs
      - name: Guardar el resultado
        run: |
          git config user.name "sondeo-bot"
          git config user.email "sondeo-bot@users.noreply.github.com"
          git add data/health.json
          if ! git diff --cached --quiet; then git commit -m "Prueba diaria de fuentes" && git pull --rebase origin main && git push origin HEAD:main; fi
      - name: Avisar si alguna fuente falla
        if: steps.probe.outcome == 'failure'
        run: echo "::error::Alguna fuente falla; ver data/health.json" && exit 1
